<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nex — GrapeDev</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --purple: #9b3cff;
            --purple2: #6e28ff;
            --blue: #21aaff;
            --pink: #ff36d5;

            --green: #45ff9b;

            --dark: #05040c;

        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                #05040c;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            position: relative;

        }


        /* =====================================================
           CENA PRINCIPAL
        ===================================================== */

        .scene {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                #05040c;

        }


        .scene-image {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            user-select: none;

            pointer-events: none;

            transition:
                opacity 1.2s ease,
                transform 1.5s ease,
                filter 1.2s ease;

        }


        /*
         * Nex começa dormindo
         */

        #nexScene {

            opacity: 1;

            transform:
                scale(1.015);

            filter:
                brightness(.72)
                saturate(.8)
                blur(.2px);

        }


        /*
         * Overlay para deixar o ambiente
         * mais cinematográfico
         */

        .scene-overlay {

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at center,
                    transparent 25%,
                    rgba(0,0,0,.22) 65%,
                    rgba(0,0,0,.65) 100%
                );

            transition:
                opacity 1s ease;

        }


        /*
         * Escuridão quando dormindo
         */

        .sleep-darkness {

            position: absolute;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(35,15,65,.05),
                    rgba(0,0,0,.72)
                );

            pointer-events: none;

            opacity: 1;

            transition:
                opacity 1.2s ease;

        }


        /* =====================================================
           AMBIENTE ACORDADO
        ===================================================== */

        body.awake .sleep-darkness {

            opacity: .05;

        }


        body.awake #nexScene {

            filter:
                brightness(1)
                saturate(1.15)
                contrast(1.03);

            transform:
                scale(1);

        }


        body.waking #nexScene {

            animation:
                despertarCena 1.4s ease;

        }


        @keyframes despertarCena {

            0% {

                filter:
                    brightness(.55)
                    saturate(.7);

                transform:
                    scale(1.02);

            }

            35% {

                filter:
                    brightness(1.5)
                    saturate(1.4)
                    drop-shadow(
                        0 0 40px
                        rgba(151,60,255,.9)
                    );

                transform:
                    scale(1.025);

            }

            65% {

                filter:
                    brightness(1.15)
                    saturate(1.2);

                transform:
                    scale(1.01);

            }

            100% {

                filter:
                    brightness(1)
                    saturate(1.15);

                transform:
                    scale(1);

            }

        }


        /* =====================================================
           FLASH DE DESPERTAR
        ===================================================== */

        .wake-flash {

            position: fixed;

            inset: 0;

            z-index: 40;

            pointer-events: none;

            opacity: 0;

            background:

                radial-gradient(
                    circle at center,
                    rgba(255,255,255,.95),
                    rgba(168,60,255,.4) 25%,
                    transparent 65%
                );

        }


        body.waking .wake-flash {

            animation:
                wakeFlash .9s ease;

        }


        @keyframes wakeFlash {

            0% {

                opacity: 0;

            }

            25% {

                opacity: .75;

            }

            55% {

                opacity: .18;

            }

            100% {

                opacity: 0;

            }

        }


        /* =====================================================
           GLOW
        ===================================================== */

        .ambient-glow {

            position: fixed;

            inset: -20%;

            z-index: 1;

            pointer-events: none;

            opacity: 0;

            background:

                radial-gradient(
                    ellipse at center,
                    rgba(142,46,255,.18),
                    rgba(38,91,255,.07) 35%,
                    transparent 68%
                );

            filter:
                blur(35px);

            transition:
                opacity 1.5s ease;

        }


        body.awake .ambient-glow {

            opacity: 1;

        }


        /* =====================================================
           STATUS DO NEX
        ===================================================== */

        .wake-status {

            position: fixed;

            left: 50%;

            bottom: 42px;

            transform:
                translateX(-50%);

            z-index: 60;

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                10px 17px;

            border:
                1px solid rgba(165,76,255,.28);

            border-radius:
                30px;

            background:
                rgba(7,5,17,.76);

            backdrop-filter:
                blur(15px);

            box-shadow:
                0 0 30px
                rgba(120,40,255,.15);

            color:
                rgba(255,255,255,.78);

            font-size: 12px;

            letter-spacing: .2px;

            transition:
                opacity .5s ease,
                transform .5s ease;

            cursor: default;

        }


        .wake-status.hidden {

            opacity: 0;

            transform:
                translateX(-50%)
                translateY(12px);

            pointer-events: none;

        }


        .status-dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #ffc83d;

            box-shadow:
                0 0 12px
                rgba(255,200,61,.8);

            animation:
                statusPulse 1.4s infinite;

        }


        body.awake .status-dot {

            background:
                var(--green);

            box-shadow:
                0 0 12px
                rgba(69,255,155,.9);

        }


        @keyframes statusPulse {

            0%,
            100% {

                transform: scale(1);

                opacity: .7;

            }

            50% {

                transform: scale(1.35);

                opacity: 1;

            }

        }


        /* =====================================================
           TEXTO DE AJUDA
        ===================================================== */

        .wake-hint {

            position: fixed;

            left: 50%;

            bottom: 88px;

            transform:
                translateX(-50%);

            z-index: 55;

            color:
                rgba(255,255,255,.42);

            font-size: 10px;

            letter-spacing: .4px;

            text-align: center;

            pointer-events: none;

            transition:
                opacity .5s ease;

        }


        body.awake .wake-hint {

            opacity: 0;

        }


        /* =====================================================
           INDICADOR DE ESCUTA
        ===================================================== */

        .listening-indicator {

            position: fixed;

            left: 50%;

            top: 35px;

            transform:
                translateX(-50%)
                translateY(-15px);

            z-index: 70;

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                9px 15px;

            border:
                1px solid
                rgba(69,255,155,.25);

            border-radius:
                30px;

            background:
                rgba(4,10,10,.72);

            backdrop-filter:
                blur(15px);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .35s ease,
                transform .35s ease;

            font-size: 11px;

            color:
                rgba(255,255,255,.8);

        }


        .listening-indicator.active {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        .listening-bars {

            display: flex;

            align-items: center;

            gap: 3px;

            height: 14px;

        }


        .listening-bars span {

            width: 3px;

            height: 7px;

            border-radius: 5px;

            background:
                var(--green);

            animation:
                voiceBar .8s infinite ease-in-out;

        }


        .listening-bars span:nth-child(2) {

            animation-delay: .1s;

        }


        .listening-bars span:nth-child(3) {

            animation-delay: .2s;

        }


        .listening-bars span:nth-child(4) {

            animation-delay: .3s;

        }


        @keyframes voiceBar {

            0%,
            100% {

                height: 5px;

            }

            50% {

                height: 14px;

            }

        }


        /* =====================================================
           INDICADOR FALANDO
        ===================================================== */

        .speaking-indicator {

            position: fixed;

            left: 50%;

            top: 35px;

            transform:
                translateX(-50%)
                translateY(-15px);

            z-index: 71;

            display: flex;

            align-items: center;

            gap: 8px;

            padding:
                9px 15px;

            border:
                1px solid
                rgba(168,60,255,.3);

            border-radius:
                30px;

            background:
                rgba(12,5,22,.75);

            backdrop-filter:
                blur(15px);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .35s ease,
                transform .35s ease;

            font-size: 11px;

        }


        .speaking-indicator.active {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);

        }


        .speaking-orb {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                var(--purple);

            box-shadow:
                0 0 15px
                var(--purple);

            animation:
                speakingPulse .8s infinite;

        }


        @keyframes speakingPulse {

            0%,
            100% {

                transform: scale(.8);

            }

            50% {

                transform: scale(1.5);

            }

        }


        /* =====================================================
           BOTÃO DO CELULAR
        ===================================================== */

        .phone-launcher {

            position: fixed;

            right: 28px;

            bottom: 28px;

            width: 60px;
            height: 60px;

            z-index: 100;

            border: none;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            color: white;

            font-size: 22px;

            background:
                linear-gradient(
                    135deg,
                    #7b35ff,
                    #b442ff
                );

            box-shadow:
                0 0 30px
                rgba(144,55,255,.45),
                0 12px 35px
                rgba(0,0,0,.4);

            transition:
                transform .25s ease,
                box-shadow .25s ease;

        }


        .phone-launcher:hover {

            transform:
                translateY(-4px)
                scale(1.05);

            box-shadow:
                0 0 40px
                rgba(144,55,255,.7),
                0 15px 40px
                rgba(0,0,0,.5);

        }


        .phone-launcher .arrow {

            transition:
                transform .3s ease;

        }


        .phone-launcher.open .arrow {

            transform:
                rotate(180deg);

        }


        /* =====================================================
           CELULAR
        ===================================================== */

        .phone {

            position: fixed;

            right: 30px;

            bottom: 100px;

            width: 365px;

            height: 680px;

            z-index: 90;

            opacity: 0;

            pointer-events: none;

            transform:
                translateY(30px)
                scale(.94);

            transition:
                opacity .35s ease,
                transform .4s cubic-bezier(.2,.8,.2,1);

        }


        .phone.open {

            opacity: 1;

            pointer-events: auto;

            transform:
                translateY(0)
                scale(1);

        }


        .phone-frame {

            position: relative;

            width: 100%;
            height: 100%;

            padding: 7px;

            border:
                2px solid
                rgba(255,255,255,.15);

            border-radius: 45px;

            background:
                linear-gradient(
                    145deg,
                    #262331,
                    #0a0910 40%,
                    #20172c
                );

            box-shadow:
                0 35px 90px
                rgba(0,0,0,.65),
                0 0 55px
                rgba(130,40,255,.2);

        }


        .phone-inner {

            position: relative;

            width: 100%;
            height: 100%;

            overflow: hidden;

            border-radius: 38px;

            background:
                #07070d;

            border:
                1px solid
                rgba(255,255,255,.08);

        }


        /* =====================================================
           ILHA
        ===================================================== */

        .dynamic-island {

            position: absolute;

            top: 10px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 108px;

            height: 28px;

            border-radius: 30px;

            background:
                #020204;

            z-index: 20;

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,.04),
                0 2px 8px
                rgba(0,0,0,.7);

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .phone-status {

            height: 48px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                14px 20px 0;

            font-size: 11px;

            font-weight: 600;

            color:
                rgba(255,255,255,.9);

        }


        .phone-icons {

            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 9px;

            opacity: .8;

        }


        /* =====================================================
           APP
        ===================================================== */

        .phone-app {

            position: absolute;

            inset:
                48px 0 0;

            display: flex;

            flex-direction: column;

            background:
                linear-gradient(
                    180deg,
                    #0e0b18,
                    #07070c
                );

        }


        /* =====================================================
           HEADER DO CHAT
        ===================================================== */

        .app-header {

            min-height: 66px;

            padding:
                9px 14px;

            display: flex;

            align-items: center;

            gap: 10px;

            border-bottom:
                1px solid
                rgba(255,255,255,.07);

            background:
                rgba(16,12,27,.9);

            backdrop-filter:
                blur(20px);

        }


        .nex-avatar {

            width: 37px;
            height: 37px;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #752bff,
                    #b73dff
                );

            box-shadow:
                0 0 18px
                rgba(157,53,255,.35);

        }


        .nex-avatar img {

            width: 100%;
            height: 100%;

            object-fit: cover;

        }


        .app-title {

            display: flex;

            flex-direction: column;

            gap: 2px;

        }


        .app-title strong {

            font-size: 14px;

        }


        .app-title span {

            font-size: 9px;

            color:
                rgba(255,255,255,.42);

        }


        .online {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--green);

            box-shadow:
                0 0 10px
                rgba(69,255,155,.8);

        }


        .close-phone {

            margin-left: auto;

            width: 30px;
            height: 30px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.07);

            color:
                rgba(255,255,255,.8);

            font-size: 17px;

            cursor: pointer;

            transition:
                .2s ease;

        }


        .close-phone:hover {

            background:
                rgba(255,255,255,.14);

            color: white;

        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        .phone-content {

            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;

        }


        /* =====================================================
           MENSAGENS
        ===================================================== */

        .messages {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                17px 13px 12px;

            display: flex;

            flex-direction: column;

            gap: 10px;

            scroll-behavior: smooth;

        }


        .messages::-webkit-scrollbar {

            width: 3px;

        }


        .messages::-webkit-scrollbar-thumb {

            background:
                rgba(158,63,255,.4);

            border-radius: 10px;

        }


        .message {

            position: relative;

            max-width: 84%;

            padding:
                10px 12px;

            border-radius: 15px;

            font-size: 11px;

            line-height: 1.5;

            animation:
                messageIn .3s ease;

            word-wrap: break-word;

        }


        @keyframes messageIn {

            from {

                opacity: 0;

                transform:
                    translateY(8px)
                    scale(.98);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        .message small {

            display: block;

            margin-bottom: 4px;

            font-size: 8px;

            letter-spacing: .5px;

            color:
                rgba(255,255,255,.38);

        }


        .message.nex {

            align-self: flex-start;

            background:
                linear-gradient(
                    135deg,
                    rgba(126,54,190,.2),
                    rgba(77,35,125,.12)
                );

            border:
                1px solid
                rgba(172,77,255,.15);

            border-bottom-left-radius: 5px;

            box-shadow:
                0 6px 20px
                rgba(0,0,0,.12);

        }


        .message.user {

            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #7135ed,
                    #a03bff
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            border-bottom-right-radius: 5px;

            box-shadow:
                0 8px 20px
                rgba(87,31,180,.22);

        }


        /* =====================================================
           DIGITANDO
        ===================================================== */

        .typing {

            display: flex;

            align-items: center;

            gap: 4px;

            height: 10px;

        }


        .typing span {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.55);

            animation:
                typing 1s infinite;

        }


        .typing span:nth-child(2) {

            animation-delay:
                .15s;

        }


        .typing span:nth-child(3) {

            animation-delay:
                .3s;

        }


        @keyframes typing {

            0%,
            100% {

                opacity: .3;

                transform:
                    translateY(0);

            }

            50% {

                opacity: 1;

                transform:
                    translateY(-3px);

            }

        }


        /* =====================================================
           SUGESTÕES
        ===================================================== */

        .suggestions {

            display: flex;

            gap: 6px;

            overflow-x: auto;

            padding:
                8px 10px;

            border-top:
                1px solid
                rgba(255,255,255,.045);

        }


        .suggestions::-webkit-scrollbar {

            display: none;

        }


        .suggestion {

            flex-shrink: 0;

            padding:
                7px 10px;

            border:
                1px solid
                rgba(160,68,255,.22);

            border-radius: 11px;

            background:
                rgba(134,55,255,.08);

            color:
                rgba(255,255,255,.7);

            font-size: 9px;

            cursor: pointer;

            white-space: nowrap;

            transition:
                .2s ease;

        }


        .suggestion:hover {

            color: white;

            background:
                rgba(134,55,255,.2);

            border-color:
                rgba(180,80,255,.45);

        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-area {

            display: flex;

            align-items: center;

            gap: 6px;

            padding:
                9px;

            background:
                rgba(6,6,11,.95);

            border-top:
                1px solid
                rgba(255,255,255,.07);

        }


        #messageInput {

            flex: 1;

            min-width: 0;

            height: 39px;

            padding:
                0 12px;

            outline: none;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 13px;

            background:
                rgba(255,255,255,.055);

            color: white;

            font-size: 10px;

            transition:
                border .2s ease,
                box-shadow .2s ease;

        }


        #messageInput:focus {

            border-color:
                rgba(160,70,255,.45);

            box-shadow:
                0 0 15px
                rgba(130,45,255,.1);

        }


        #messageInput::placeholder {

            color:
                rgba(255,255,255,.28);

        }


        .action-button {

            width: 39px;
            height: 39px;

            flex-shrink: 0;

            border: none;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            background:
                rgba(255,255,255,.07);

            cursor: pointer;

            font-size: 14px;

            transition:
                .2s ease;

        }


        .action-button:hover {

            background:
                rgba(255,255,255,.13);

        }


        .send-button {

            background:
                linear-gradient(
                    135deg,
                    #743cff,
                    #b23cff
                );

            box-shadow:
                0 0 16px
                rgba(146,54,255,.22);

        }


        .send-button:disabled {

            opacity: .4;

            cursor: not-allowed;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .phone {

                right: 12px;
                left: 12px;

                bottom: 88px;

                width: auto;

                height:
                    min(650px, calc(100vh - 110px));

            }


            .phone-launcher {

                right: 18px;

                bottom: 18px;

                width: 55px;
                height: 55px;

            }


            .wake-status {

                bottom: 28px;

                font-size: 10px;

                max-width:
                    calc(100% - 30px);

                white-space:
                    nowrap;

            }


            .wake-hint {

                bottom: 67px;

                font-size: 9px;

            }


            .listening-indicator,
            .speaking-indicator {

                top: 18px;

            }

        }


    </style>

</head>


<body>


    <!-- =====================================================
         CENA
    ===================================================== -->

    <div class="scene">

        <img
            id="nexScene"
            class="scene-image"
            src="../../storage/expressoes/nex_dormindo.png"
            alt="Nex dormindo"
        >

        <div class="scene-overlay"></div>

        <div class="sleep-darkness"></div>

    </div>


    <div class="ambient-glow"></div>

    <div class="wake-flash"></div>


    <!-- =====================================================
         INDICADOR DE ESCUTA
    ===================================================== -->

    <div
        class="listening-indicator"
        id="listeningIndicator"
    >

        <div class="listening-bars">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <span>
            Estou ouvindo...
        </span>

    </div>


    <!-- =====================================================
         INDICADOR FALANDO
    ===================================================== -->

    <div
        class="speaking-indicator"
        id="speakingIndicator"
    >

        <span class="speaking-orb"></span>

        <span>
            Nex está falando...
        </span>

    </div>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <div
        class="wake-status"
        id="wakeStatus"
    >

        <span class="status-dot"></span>

        <span id="wakeStatusText">
            Nex está dormindo...
        </span>

    </div>


    <div
        class="wake-hint"
        id="wakeHint"
    >

        👏 Bata uma palma para acordar o Nex

    </div>


    <!-- =====================================================
         BOTÃO DO CELULAR
    ===================================================== -->

    <button
        class="phone-launcher"
        id="phoneLauncher"
        title="Abrir conversa"
    >

        <span
            class="arrow"
            id="phoneArrow"
        >
            ↗
        </span>

    </button>


    <!-- =====================================================
         CELULAR
    ===================================================== -->

    <div
        class="phone"
        id="phone"
    >

        <div class="phone-frame">

            <div class="phone-inner">


                <div class="dynamic-island"></div>


                <!-- STATUS -->

                <div class="phone-status">

                    <span id="phoneTime">
                        08:18
                    </span>

                    <div class="phone-icons">

                        <span>●</span>

                        <span>▮▮</span>

                        <span>▰</span>

                    </div>

                </div>


                <!-- APP -->

                <div class="phone-app">


                    <!-- HEADER -->

                    <div class="app-header">


                        <div class="nex-avatar">

                            <img
                                src="../../storage/images/nex_perfil.png"
                                alt="Nex"
                            >

                        </div>


                        <div class="app-title">

                            <strong>
                                Nex

                            <span>
                                Assistente GrapeDev
                            </span>

                        </div>


                        <span class="online"></span>


                        <button
                            class="close-phone"
                            id="closePhone"
                        >
                            ×
                        </button>


                    </div>


                    <!-- CONTEÚDO -->

                    <div class="phone-content">


                        <div
                            class="messages"
                            id="messages"
                        >


                            <div class="message nex">

                                <small>
                                    NEX
                                </small>

                                Olá! 👋

                                <br><br>

                                Sou o Nex,
                                assistente virtual
                                da GrapeDev.

                                <br><br>

                                Você pode falar comigo
                                diretamente por voz ou
                                usar o chat.

                            </div>


                        </div>


                        <!-- SUGESTÕES -->

                        <div class="suggestions">


                            <button
                                class="suggestion"
                                data-message="Olá Nex!"
                            >
                                👋 Olá
                            </button>


                            <button
                                class="suggestion"
                                data-message="O que é o AquaFlow?"
                            >
                                💧 AquaFlow
                            </button>


                            <button
                                class="suggestion"
                                data-message="O que é a GrapeDev?"
                            >
                                🍇 GrapeDev
                            </button>


                            <button
                                class="suggestion"
                                data-message="Como você funciona?"
                            >
                                🤖 Como funciona?
                            </button>


                        </div>

                        <div class="input-area">


                            <button
                                class="action-button"
                                id="voiceButton"

                                placeholder="Digite uma mensagem..."

    <script>


        /* =====================================================
           ELEMENTOS
        ===================================================== */

        const nexScene =
            document.getElementById(
                "nexScene"
            );


        const wakeStatus =
            document.getElementById(
                "wakeStatus"
            );


        const wakeStatusText =
            document.getElementById(
                "wakeStatusText"
            );


        const wakeHint =
            document.getElementById(
                "wakeHint"
            );


        const messages =
            document.getElementById(
                "messages"
            );


        const input =
            document.getElementById(
                "messageInput"
            );


        const sendButton =
            document.getElementById(
                "sendButton"
            );


        const voiceButton =
            document.getElementById(
                "voiceButton"
            );


        const phone =
            document.getElementById(
                "phone"
            );


        const phoneLauncher =
            document.getElementById(
                "phoneLauncher"
            );


        const closePhone =
            document.getElementById(
                "closePhone"
            );


        const listeningIndicator =
            document.getElementById(
                "listeningIndicator"
            );


        const speakingIndicator =
            document.getElementById(
                "speakingIndicator"
            );


        const phoneTime =
            document.getElementById(
                "phoneTime"
            );


        /* =====================================================
           ESTADO
        ===================================================== */

        let nexAwake = false;

        let microphoneStream = null;

        let audioContext = null;

        let analyser = null;

        let microphoneSource = null;

        let clapDetectorAtivo = false;

        let recognition = null;

        let reconhecimentoAtivo = false;

        let falando = false;

        let processando = false;

        let ultimoClap = 0;


        /* =====================================================
           ADICIONAR MENSAGEM
        ===================================================== */

        function adicionarMensagem(
            texto,
            tipo
        ) {

            if (!messages) {
                return;
            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "message " + tipo;


            const small =
                document.createElement(
                    "small"
                );


            small.textContent =
                tipo === "nex"
                    ? "NEX"
                    : "VOCÊ";


            const textoDiv =
                document.createElement(
                    "div"
                );


            textoDiv.textContent =
                texto;


            div.appendChild(
                small
            );


            div.appendChild(
                textoDiv
            );


            messages.appendChild(
                div
            );


            messages.scrollTop =
                messages.scrollHeight;

        }


        /* =====================================================
           FALAR COM O NEX
        ===================================================== */

        async function falarNex(
            texto
        ) {

            if (!texto) {
                return;
            }


            try {

                falando = true;


                speakingIndicator
                    .classList
                    .add("active");


                const resposta =
                    await fetch(
                        "../../backend/api/voz.php",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({
                                    text: texto
                                })

                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao gerar voz: " +
                        resposta.status
                    );

                }


                const blob =
                    await resposta.blob();


                if (
                    !blob ||
                    blob.size === 0
                ) {

                    throw new Error(
                        "O servidor não retornou áudio."
                    );

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const audio =
                    new Audio(url);


                audio.volume = 1;


                audio.onplay =
                    function() {

                        falando = true;

                        document.body
                            .classList
                            .add("speaking");

                    };


                audio.onended =
                    function() {

                        falando = false;

                        document.body
                            .classList
                            .remove("speaking");


                        speakingIndicator
                            .classList
                            .remove("active");


                        URL.revokeObjectURL(
                            url
                        );


                        /*
                         * Depois que termina de falar,
                         * volta a ouvir automaticamente.
                         */

                        if (nexAwake) {

                            iniciarReconhecimento();

                        }

                    };


                audio.onerror =
                    function() {

                        falando = false;

                        document.body
                            .classList
                            .remove("speaking");


                        speakingIndicator
                            .classList
                            .remove("active");


                        URL.revokeObjectURL(
                            url
                        );

                    };


                await audio.play();

            }

            catch (erro) {

                console.error(
                    "Erro na voz:",
                    erro
                );


                falando = false;


                speakingIndicator
                    .classList
                    .remove("active");

            }

        }


        /* =====================================================
           CHAT COM A IA
        ===================================================== */

        async function responder(
            textoRecebido = null
        ) {

            if (processando) {
                return;
            }


            let texto =
                textoRecebido;


            if (!texto) {

                texto =
                    input.value.trim();

            }


            if (!texto) {
                return;
            }


            if (!nexAwake) {

                return;

            }


            processando = true;


            adicionarMensagem(
                texto,
                "user"
            );


            input.value = "";


            const pensando =
                document.createElement(
                    "div"
                );


            pensando.className =
                "message nex";


            pensando.innerHTML = `

                <small>NEX</small>

                <div class="typing">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            `;


            messages.appendChild(
                pensando
            );


            messages.scrollTop =
                messages.scrollHeight;


            sendButton.disabled =
                true;


            try {

                const resposta =
                    await fetch(
                        "../..//backend/api/chat.php",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    message:
                                        texto

                                })

                        }
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "HTTP " +
                        resposta.status
                    );

                }


                const dados =
                    await resposta.json();


                if (dados.error) {

                    throw new Error(
                        dados.error
                    );

                }


                pensando.remove();


                const respostaNex =
                    dados.response;


                if (!respostaNex) {

                    throw new Error(
                        "A IA não respondeu."
                    );

                }


                adicionarMensagem(
                    respostaNex,
                    "nex"
                );


                await falarNex(
                    respostaNex
                );

            }

            catch (erro) {

                console.error(
                    "Erro no chat:",
                    erro
                );


                if (pensando) {
                    pensando.remove();
                }


                const erroTexto =
                    "Erro ao conectar com meu cérebro: " +
                    (erro.message || "erro desconhecido.");


                adicionarMensagem(
                    erroTexto,
                    "nex"
                );

            }

            finally {

                processando =
                    false;

                sendButton.disabled =
                    false;

            }

        }


        /* =====================================================
           ENVIAR PELO BOTÃO
        ===================================================== */

        sendButton.addEventListener(
            "click",
            function() {

                responder();

            }
        );


        /* =====================================================
           ENTER
        ===================================================== */

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    responder();

                }

            }
        );


        /* =====================================================
           SUGESTÕES
        ===================================================== */

        document
            .querySelectorAll(
                ".suggestion"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const texto =
                                button.dataset.message;

                            responder(
                                texto
                            );

                        }
                    );

                }
            );


        /* =====================================================
           RECONHECIMENTO DE VOZ
        ===================================================== */

        const Recognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (Recognition) {

            recognition =
                new Recognition();


            recognition.lang =
                "pt-BR";


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.maxAlternatives =
                1;


            recognition.onstart =
                function() {

                    reconhecimentoAtivo =
                        true;


                    listeningIndicator
                        .classList
                        .add("active");

                };


            recognition.onend =
                function() {

                    reconhecimentoAtivo =
                        false;


                    listeningIndicator
                        .classList
                        .remove("active");

                };


            recognition.onresult =
                function(event) {

                    if (!nexAwake) {
                        return;
                    }


                    const texto =
                        event
                            .results[0][0]
                            .transcript
                            .trim();


                    if (!texto) {
                        return;
                    }


                    responder(
                        texto
                    );

                };


            recognition.onerror =
                function(event) {

                    console.log(
                        "Reconhecimento:",
                        event.error
                    );


                    reconhecimentoAtivo =
                        false;


                    listeningIndicator
                        .classList
                        .remove("active");


                    /*
                     * Não mostra erro para
                     * no-speech, pois é normal
                     * quando a pessoa fica em silêncio.
                     */

                };

        }


        /* =====================================================
           INICIAR RECONHECIMENTO
        ===================================================== */

        function iniciarReconhecimento() {

            if (!nexAwake) {
                return;
            }


            if (!recognition) {
                return;
            }


            if (falando) {
                return;
            }


            if (processando) {
                return;
            }


            if (reconhecimentoAtivo) {
                return;
            }


            try {

                recognition.start();

            }

            catch (erro) {

                console.log(
                    "Reconhecimento já iniciado."
                );

            }

        }


        /* =====================================================
           BOTÃO DE MICROFONE
        ===================================================== */

        voiceButton.addEventListener(
            "click",
            function() {

                if (!nexAwake) {
                    return;
                }


                iniciarReconhecimento();

            }
        );


        /* =====================================================
           MICROFONE / DETECTOR DE PALMA
        ===================================================== */

        async function ativarMicrofone() {

            try {

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {

                    throw new Error(
                        "Seu navegador não permite acesso ao microfone."
                    );

                }


                wakeStatusText.textContent =
                    "Solicitando acesso ao microfone...";


                /*
                 * Pede permissão logo ao abrir a página.
                 */

                microphoneStream =
                    await navigator
                        .mediaDevices
                        .getUserMedia({

                            audio: {

                                echoCancellation: false,

                                noiseSuppression: false,

                                autoGainControl: false

                            }

                        });


                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();


                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    await audioContext.resume();

                }


                /*
                 * Criamos filtros para eliminar
                 * parte dos sons graves da sala.
                 */

                const highpass =
                    audioContext
                        .createBiquadFilter();


                highpass.type =
                    "highpass";


                highpass.frequency.value =
                    900;


                highpass.Q.value =
                    .7;


                const lowpass =
                    audioContext
                        .createBiquadFilter();


                lowpass.type =
                    "lowpass";


                lowpass.frequency.value =
                    5000;


                lowpass.Q.value =
                    .7;


                analyser =
                    audioContext
                        .createAnalyser();


                analyser.fftSize =
                    2048;


                analyser.smoothingTimeConstant =
                    .05;


                microphoneSource =
                    audioContext
                        .createMediaStreamSource(
                            microphoneStream
                        );


                microphoneSource
                    .connect(
                        highpass
                    );


                highpass
                    .connect(
                        lowpass
                    );


                lowpass
                    .connect(
                        analyser
                    );


                clapDetectorAtivo =
                    true;


                wakeStatusText.textContent =
                    "Nex está dormindo...";


                detectarPalma();

            }

            catch (erro) {

                console.error(
                    "Microfone:",
                    erro
                );


                wakeStatusText.textContent =
                    "⚠️ Permita o microfone para acordar o Nex";


                wakeHint.textContent =
                    "Clique na página e permita o acesso ao microfone.";

            }

        }


        /* =====================================================
           DETECTOR DE PALMA
        ===================================================== */

        function detectarPalma() {

            if (
                !clapDetectorAtivo ||
                nexAwake ||
                !analyser
            ) {

                return;

            }


            const buffer =
                new Float32Array(
                    analyser.fftSize
                );


            /*
             * Histórico do ambiente.
             */

            let noiseFloor =
                0.008;


            let ultimoNivel =
                0;


            let picoDetectado =
                false;


            let inicioPico =
                0;


            let maiorPico =
                0;


            function analisar() {

                if (
                    !clapDetectorAtivo ||
                    nexAwake
                ) {

                    return;

                }


                analyser
                    .getFloatTimeDomainData(
                        buffer
                    );


                /*
                 * RMS = volume real do sinal.
                 */

                let soma =
                    0;


                let pico =
                    0;


                for (
                    let i = 0;
                    i < buffer.length;
                    i++
                ) {

                    const valor =
                        Math.abs(
                            buffer[i]
                        );


                    soma +=
                        valor * valor;


                    if (
                        valor > pico
                    ) {

                        pico =
                            valor;

                    }

                }


                const rms =
                    Math.sqrt(
                        soma /
                        buffer.length
                    );


                /*
                 * Adaptamos lentamente o nível
                 * normal do ambiente.
                 */

                if (
                    !picoDetectado &&
                    rms < 0.045
                ) {

                    noiseFloor =
                        noiseFloor * .985 +
                        rms * .015;

                }


                /*
                 * Uma palma geralmente tem:
                 *
                 * - ataque muito rápido;
                 * - pico alto;
                 * - curta duração.
                 */

                const agora =
                    performance.now();


                const limite =
                    Math.max(
                        0.075,
                        noiseFloor * 5.5
                    );


                /*
                 * Começo de uma possível palma.
                 */

                if (
                    !picoDetectado &&
                    pico > limite
                ) {

                    picoDetectado =
                        true;


                    inicioPico =
                        agora;


                    maiorPico =
                        pico;

                }


                /*
                 * Estamos dentro do possível
                 * som de palma.
                 */

                if (picoDetectado) {

                    if (
                        pico > maiorPico
                    ) {

                        maiorPico =
                            pico;

                    }


                    const duracao =
                        agora -
                        inicioPico;


                    /*
                     * O som precisa cair rapidamente.
                     */

                    const caiu =
                        pico <
                        maiorPico * .48;


                    /*
                     * Evita fala longa.
                     */

                    if (
                        duracao > 350
                    ) {

                        picoDetectado =
                            false;


                        maiorPico =
                            0;

                    }


                    /*
                     * Palma confirmada.
                     */

                    if (
                        duracao > 25 &&
                        duracao < 280 &&
                        caiu &&
                        maiorPico > .12
                    ) {

                        if (
                            agora -
                            ultimoClap >
                            1000
                        ) {

                            ultimoClap =
                                agora;


                            picoDetectado =
                                false;


                            acordarNex();


                            return;

                        }

                    }

                }


                ultimoNivel =
                    rms;


                requestAnimationFrame(
                    analisar
                );

            }


            analisar();

        }


        /* =====================================================
           ACORDAR NEX
        ===================================================== */

        async function acordarNex() {

            if (nexAwake) {
                return;
            }


            nexAwake =
                true;


            clapDetectorAtivo =
                false;


            document.body
                .classList
                .add("waking");


            wakeStatusText.textContent =
                "⚡ Nex acordando...";


            wakeHint.textContent =
                "";


            /*
             * Troca a imagem depois
             * do primeiro impacto da animação.
             */

            setTimeout(
                function() {

                    nexScene.src =
                        "../../storage/expressoes/nex_normal.png";

                },
                350
            );


            /*
             * Ambiente acende.
             */

            setTimeout(
                function() {

                    document.body
                        .classList
                        .add("awake");

                },
                200
            );


            /*
             * Espera a animação.
             */

            setTimeout(
                async function() {

                    document.body
                        .classList
                        .remove("waking");


                    wakeStatusText.textContent =
                        "Nex está acordado";


                    const mensagem =
                        "Ah... olá! " +
                        "Eu acordei. " +
                        "Como posso ajudar você?";


                    adicionarMensagem(
                        mensagem,
                        "nex"
                    );


                    await falarNex(
                        mensagem
                    );


                    /*
                     * Depois da fala,
                     * começa a ouvir.
                     */

                    setTimeout(
                        iniciarReconhecimento,
                        500
                    );

                },
                1500
            );

        }


        /* =====================================================
           ABRIR CELULAR
        ===================================================== */

        phoneLauncher.addEventListener(
            "click",
            function() {

                const aberto =
                    phone.classList.contains(
                        "open"
                    );


                if (aberto) {

                    phone.classList
                        .remove(
                            "open"
                        );


                    phoneLauncher.classList
                        .remove(
                            "open"
                        );

                }

                else {

                    phone.classList
                        .add(
                            "open"
                        );


                    phoneLauncher.classList
                        .add(
                            "open"
                        );

                }

            }
        );


        /* =====================================================
           FECHAR CELULAR
        ===================================================== */

        closePhone.addEventListener(
            "click",
            function() {

                phone.classList
                    .remove(
                        "open"
                    );


                phoneLauncher.classList
                    .remove(
                        "open"
                    );

            }
        );


        /* =====================================================
           RELÓGIO
        ===================================================== */

        function atualizarHora() {

            const agora =
                new Date();


            const horas =
                String(
                    agora.getHours()
                ).padStart(
                    2,
                    "0"
                );


            const minutos =
                String(
                    agora.getMinutes()
                ).padStart(
                    2,
                    "0"
                );


            phoneTime.textContent =
                `${horas}:${minutos}`;

        }


        atualizarHora();


        setInterval(
            atualizarHora,
            1000
        );


        /* =====================================================
           INICIALIZAÇÃO
        ===================================================== */

        window.addEventListener(
            "load",
            function() {

                console.log(
                    "🤖 Nex iniciado."
                );


                console.log(
                    "💤 Estado: dormindo."
                );


                console.log(
                    "👏 Aguardando uma palma."
                );


                /*
                 * Solicita o microfone.
                 */

                ativarMicrofone();

            }
        );


    </script>
