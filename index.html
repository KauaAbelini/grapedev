
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030107">
<title>GrapeDev — Create the Future</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #030107;
    --purple: #963cff;
    --violet: #c58aff;
    --blue: #21aaff;
    --cyan: #39e4ff;
    --white: #f5f1fa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
}

body {
    font-family: 'Nunito', Arial, sans-serif;
    color: white;
}

#intro {
    position: fixed;
    inset: 0;
    z-index: 999999;
    overflow: hidden;
    isolation: isolate;
    background:
        radial-gradient(ellipse at 50% 42%, rgba(94, 34, 181, .25), transparent 36%),
        radial-gradient(ellipse at 68% 45%, rgba(0, 119, 255, .10), transparent 37%),
        radial-gradient(ellipse at 50% 100%, rgba(57, 20, 112, .24), transparent 50%),
        #030107;
    transition: opacity .8s ease, transform .8s ease;
}

#intro.saindo {
    opacity: 0;
    transform: scale(1.035);
    pointer-events: none;
}

#particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.ambient {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: .45;
    background-image:
        linear-gradient(rgba(143, 75, 255, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(143, 75, 255, .035) 1px, transparent 1px);
    background-size: 58px 58px;
    mask-image: radial-gradient(ellipse at center, black, transparent 75%);
}

.vignette {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 38%, rgba(2, 0, 8, .65) 100%);
}

/* Marca */

.brand {
    position: absolute;
    top: 29px;
    left: 34px;
    z-index: 100;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 4px;
}

.brand span {
    color: var(--violet);
}

.version {
    position: absolute;
    top: 33px;
    right: 34px;
    z-index: 100;
    color: #9576b6;
    font-size: 9px;
    letter-spacing: 3px;
}

/* Palco central */

.stage {
    position: absolute;
    left: 50%;
    top: 43%;
    width: min(680px, 100vw);
    height: min(600px, 80vh);
    transform: translate(-50%, -50%);
    display: grid;
    place-items: center;
    perspective: 1000px;
}

.aura {
    position: absolute;
    width: min(400px, 70vw);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 53, 255, .36), rgba(33, 170, 255, .09) 43%, transparent 70%);
    filter: blur(30px);
    animation: auraPulse 4s ease-in-out infinite;
}

.aura::after {
    content: "";
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background: rgba(33, 170, 255, .13);
    filter: blur(38px);
}

/* Anéis holográficos */

.ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.ring.one {
    width: min(470px, 88vw);
    height: 155px;
    border: 1px solid rgba(155, 81, 255, .65);
    box-shadow: 0 0 24px rgba(139, 53, 255, .15), inset 0 0 20px rgba(139, 53, 255, .08);
    transform: rotateX(68deg);
    animation: ringOne 12s linear infinite;
}

.ring.two {
    width: min(410px, 78vw);
    height: 135px;
    border: 1px dashed rgba(65, 176, 255, .65);
    transform: rotateX(68deg) rotateZ(55deg);
    animation: ringTwo 10s linear infinite;
}

.ring.three {
    width: min(340px, 67vw);
    height: 110px;
    border: 1px solid rgba(195, 143, 255, .38);
    transform: rotateX(68deg) rotateZ(-48deg);
    animation: ringThree 8s linear infinite;
}

.scanner {
    position: absolute;
    width: min(370px, 76vw);
    aspect-ratio: 1;
    border: 1px solid rgba(163, 101, 255, .18);
    border-radius: 50%;
    animation: scannerRotate 12s linear infinite;
}

.scanner::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    height: 50%;
    width: 2px;
    transform-origin: bottom;
    background: linear-gradient(to top, rgba(174, 105, 255, .85), transparent);
    box-shadow: 0 0 14px var(--purple);
}

.scanner::after {
    content: "";
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    border: 1px dashed rgba(33, 170, 255, .15);
}

/* Fluxo de água ao redor da uva */

.water-orbit {
    position: absolute;
    width: min(490px, 95vw);
    height: min(270px, 53vw);
    max-height: 300px;
    border: 0;
    border-radius: 50%;
    transform: rotate(-12deg);
    z-index: 8;
    pointer-events: none;
    filter: drop-shadow(0 0 8px rgba(33, 170, 255, .45));
}

.water-orbit::before,
.water-orbit::after {
    content: "";
    position: absolute;
    inset: 10px 0;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: rgba(48, 207, 255, .85);
    border-bottom-color: rgba(38, 116, 255, .6);
    transform: rotate(-8deg);
    filter: blur(.2px);
    animation: waterSpin 5s linear infinite;
}

.water-orbit::after {
    inset: 23px 12px;
    border-width: 1px;
    border-top-color: rgba(158, 110, 255, .8);
    border-bottom-color: rgba(33, 170, 255, .8);
    transform: rotate(12deg);
    animation-direction: reverse;
    animation-duration: 7s;
}

.water-trail {
    position: absolute;
    width: min(460px, 90vw);
    height: min(250px, 49vw);
    max-height: 280px;
    z-index: 9;
    border-radius: 50%;
    border: 1px solid rgba(43, 184, 255, .42);
    transform: rotate(14deg);
    box-shadow: 0 0 16px rgba(33, 170, 255, .08);
    animation: trailPulse 3s ease-in-out infinite;
    pointer-events: none;
}

.water-drop {
    position: absolute;
    z-index: 12;
    width: 10px;
    height: 15px;
    border-radius: 70% 30% 65% 35%;
    background: linear-gradient(145deg, #c3faff, #20aaff 60%, #593bff);
    box-shadow: 0 0 12px #21aaff, 0 0 26px rgba(33, 170, 255, .5);
    animation: dropFloat 3s ease-in-out infinite;
}

.drop-a { left: 17%; top: 43%; animation-delay: -.8s; }
.drop-b { right: 16%; top: 37%; animation-delay: -1.6s; width: 7px; height: 11px; }
.drop-c { left: 31%; bottom: 18%; animation-delay: -.3s; width: 6px; height: 9px; }
.drop-d { right: 27%; bottom: 22%; animation-delay: -2s; width: 8px; height: 12px; }

/* Uva */

.grapeWrap {
    position: absolute;
    z-index: 10;
    width: min(350px, 66vw);
    aspect-ratio: 1;
    opacity: 0;
    transform: translateY(24px) scale(.58) rotateY(-18deg);
    filter: blur(12px) brightness(.4);
    animation: grapeAppear 1.3s .45s cubic-bezier(.12, .8, .18, 1) forwards;
}

.grapeWrap::before {
    content: "";
    position: absolute;
    inset: 12%;
    z-index: -1;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(153, 74, 255, .43), transparent 68%);
    filter: blur(30px);
}

.grapeWrap::after {
    content: "";
    position: absolute;
    inset: 13%;
    border-radius: 50%;
    border: 1px solid rgba(187, 118, 255, .16);
    box-shadow: 0 0 35px rgba(139, 53, 255, .15);
    animation: grapeHalo 3s ease-in-out infinite;
    pointer-events: none;
}

.grape {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    mix-blend-mode: screen;
    user-select: none;
    -webkit-user-drag: none;
    filter: drop-shadow(0 0 16px rgba(128, 48, 255, .35));
    animation: grapeFloat 4s 1.8s ease-in-out infinite;
}

/* Nex */

.nex {
    position: absolute;
    z-index: 20;
    width: 155px;
    height: 155px;
    left: calc(50% + 140px);
    top: calc(50% - 65px);
    opacity: 0;
    transform: translateX(75px) scale(.5) rotateY(-25deg);
    animation: nexAppear 1.1s 1.9s cubic-bezier(.16, .8, .2, 1) forwards;
}

.nex-energy {
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(33, 170, 255, .45);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(33, 170, 255, .12);
    animation: scannerRotate 8s linear infinite;
}

.nex-energy::before,
.nex-energy::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px dashed rgba(169, 105, 255, .45);
}

.nex-energy::after {
    inset: 24px;
    border-style: solid;
    border-color: rgba(33, 170, 255, .3);
}

.nex-core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100px;
    height: 100px;
    transform: translate(-50%, -50%);
    border-radius: 30px;
    background: linear-gradient(145deg, #24103c, #09040f 65%);
    border: 1px solid rgba(191, 126, 255, .8);
    box-shadow:
        0 0 25px rgba(143, 65, 255, .45),
        0 0 35px rgba(33, 170, 255, .13),
        inset 0 0 30px rgba(116, 38, 209, .2);
}

.nex-core::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 36px;
    border: 1px solid rgba(170, 88, 255, .35);
    animation: nexPulse 2s ease-in-out infinite;
}

.nex-face {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 57px;
    transform: translate(-50%, -50%);
    border-radius: 18px;
    background: radial-gradient(circle at 50% 35%, rgba(183, 117, 255, .2), transparent 65%), #08050d;
    border: 1px solid rgba(185, 125, 255, .65);
    box-shadow: inset 0 0 15px rgba(144, 65, 255, .28), 0 0 10px rgba(158, 76, 255, .2);
}

.nex-eye {
    position: absolute;
    top: 17px;
    width: 9px;
    height: 14px;
    border-radius: 50%;
    background: #c9f7ff;
    box-shadow: 0 0 8px #a85aff, 0 0 18px rgba(33, 170, 255, .8);
    animation: eyePulse 2s ease-in-out infinite;
}

.nex-eye.left { left: 16px; }
.nex-eye.right { right: 16px; }

.nex-mouth {
    position: absolute;
    left: 50%;
    bottom: 9px;
    width: 21px;
    height: 4px;
    transform: translateX(-50%);
    border-radius: 20px;
    background: #39cfff;
    box-shadow: 0 0 8px #21aaff;
}

.nex-antenna {
    position: absolute;
    left: 50%;
    top: -24px;
    width: 2px;
    height: 23px;
    transform: translateX(-50%);
    background: linear-gradient(to top, #8b3fe5, #21aaff, transparent);
}

.nex-antenna::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 50%;
    width: 8px;
    height: 8px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #bdfaff;
    box-shadow: 0 0 12px #21aaff, 0 0 18px #8737e6;
    animation: antennaPulse 1.2s infinite;
}

.nex-dot {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #21aaff;
    box-shadow: 0 0 8px #21aaff;
}
.nex-dot.one { left: -13px; top: 42px; }
.nex-dot.two { right: -13px; top: 70px; }
.nex-dot.three { left: -8px; bottom: 28px; }
.nex-dot.four { right: -8px; bottom: 20px; }

/* Conexões digitais */

.connection {
    position: absolute;
    z-index: 5;
    width: 110px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(33, 170, 255, .75), rgba(169, 105, 255, .65), transparent);
    box-shadow: 0 0 8px rgba(33, 170, 255, .4);
    transform-origin: center;
    opacity: 0;
    animation: connectionIn .8s 2.6s ease forwards, connectionPulse 2.5s 3.4s ease-in-out infinite;
}
.connection.one { left: 24%; top: 39%; transform: rotate(25deg); }
.connection.two { right: 22%; top: 55%; transform: rotate(-27deg); }

.connection::after {
    content: "";
    position: absolute;
    left: 50%;
    top: -3px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9eeeff;
    box-shadow: 0 0 12px #21aaff;
}

/* Scanner horizontal */

.scanLine {
    position: absolute;
    z-index: 30;
    left: 50%;
    top: 16%;
    width: min(360px, 65vw);
    height: 2px;
    transform: translateX(-50%) scaleX(0);
    opacity: 0;
    background: linear-gradient(90deg, transparent, #d6a4ff, #21aaff, transparent);
    box-shadow: 0 0 15px #a75aff;
    animation: scanLine 1s 2s ease-in-out forwards;
}

/* Pontos */

.techDot {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #bd7bff;
    box-shadow: 0 0 12px #9a48ff;
    opacity: 0;
    animation: dotIn .5s 1.3s forwards, floatDot 2.5s 1.8s ease-in-out infinite;
}
.d1 { top: 28%; left: 19%; }
.d2 { top: 61%; right: 17%; animation-delay: 1.5s, 2s; }
.d3 { top: 33%; right: 25%; animation-delay: 1.7s, 2.1s; }
.d4 { bottom: 25%; left: 25%; animation-delay: 1.8s, 2.2s; }

/* Texto */

.content {
    position: absolute;
    z-index: 100;
    left: 50%;
    bottom: 8%;
    width: 100%;
    padding: 0 18px;
    transform: translateX(-50%);
    text-align: center;
}

.content small {
    display: block;
    color: #ad8ac6;
    font-size: 9px;
    letter-spacing: 5px;
    margin-bottom: 9px;
    opacity: 0;
    animation: textIn .6s 3.9s ease forwards;
}

.content h1 {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(38px, 6.4vw, 72px);
    font-weight: 400;
    line-height: .9;
    letter-spacing: 6px;
    color: #fff;
    text-shadow: 0 0 22px rgba(143, 62, 255, .45);
    opacity: 0;
    transform: translateY(12px);
    animation: textIn .7s 4s ease forwards;
}

.product {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    margin-top: 15px;
    opacity: 0;
    transform: translateY(10px);
    animation: textIn .8s 3.5s ease forwards;
}

.water-icon {
    position: relative;
    width: 26px;
    height: 34px;
    flex-shrink: 0;
}

.water-icon svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 8px rgba(33, 170, 255, .6));
}

.product-name {
    font-size: clamp(19px, 3vw, 30px);
    letter-spacing: 4px;
    font-weight: 700;
}

.product-name span {
    color: #21caff;
    text-shadow: 0 0 18px rgba(33, 170, 255, .3);
}

.product-caption {
    color: #8e8ba9;
    font-size: 8px;
    letter-spacing: 3px;
    margin-top: 7px;
}

.content p {
    margin-top: 11px;
    color: #a38bb9;
    font-size: 9px;
    letter-spacing: 2.5px;
    opacity: 0;
    animation: textIn .6s 4.2s ease forwards;
}

/* Progresso e botão */

.skip {
    position: absolute;
    right: 30px;
    bottom: 27px;
    z-index: 200;
    border: 1px solid rgba(185, 137, 255, .4);
    background: rgba(10, 5, 18, .75);
    color: white;
    border-radius: 999px;
    padding: 11px 17px;
    font-family: inherit;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: .25s ease;
}

.skip:hover {
    background: #6e31bc;
    border-color: #c89aff;
    box-shadow: 0 0 25px rgba(139, 53, 255, .3);
    transform: translateY(-2px);
}

.progress {
    position: absolute;
    left: 30px;
    bottom: 31px;
    width: 150px;
    height: 2px;
    background: #24142f;
    border-radius: 10px;
    overflow: hidden;
}

.progress span {
    display: block;
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, #6620c5, #c58aff, #21aaff);
    box-shadow: 0 0 12px #a75aff;
}

.percent {
    position: absolute;
    left: 30px;
    bottom: 40px;
    color: #a17bc4;
    font: 10px monospace;
    letter-spacing: 1px;
}

/* Animações */

@keyframes auraPulse {
    0%, 100% { transform: scale(.9); opacity: .65; }
    50% { transform: scale(1.12); opacity: 1; }
}

@keyframes ringOne {
    from { transform: rotateX(68deg) rotateZ(0deg); }
    to { transform: rotateX(68deg) rotateZ(360deg); }
}

@keyframes ringTwo {
    from { transform: rotateX(68deg) rotateZ(55deg); }
    to { transform: rotateX(68deg) rotateZ(-305deg); }
}

@keyframes ringThree {
    from { transform: rotateX(68deg) rotateZ(-48deg); }
    to { transform: rotateX(68deg) rotateZ(312deg); }
}

@keyframes scannerRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes waterSpin {
    from { transform: rotate(-8deg); }
    to { transform: rotate(352deg); }
}

@keyframes trailPulse {
    0%, 100% { opacity: .4; transform: rotate(14deg) scale(.98); }
    50% { opacity: .9; transform: rotate(14deg) scale(1.02); }
}

@keyframes dropFloat {
    0%, 100% { translate: 0 0; opacity: .55; }
    50% { translate: 0 -12px; opacity: 1; }
}

@keyframes grapeAppear {
    0% {
        opacity: 0;
        transform: translateY(24px) scale(.58) rotateY(-18deg);
        filter: blur(12px) brightness(.4);
    }
    55% { opacity: 1; filter: blur(2px) brightness(.85); }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateY(0);
        filter: blur(0) brightness(1);
    }
}

@keyframes grapeFloat {
    0%, 100% { transform: translateY(0) rotateY(-2deg); }
    50% { transform: translateY(-7px) rotateY(2deg); }
}

@keyframes grapeHalo {
    0%, 100% { opacity: .3; transform: scale(.98); }
    50% { opacity: .8; transform: scale(1.04); }
}

@keyframes nexAppear {
    0% { opacity: 0; transform: translateX(75px) scale(.5) rotateY(-25deg); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: translateX(0) scale(1) rotateY(0); }
}

@keyframes nexPulse {
    0%, 100% { opacity: .45; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.025); }
}

@keyframes eyePulse {
    0%, 100% { opacity: .8; transform: scaleY(1); }
    50% { opacity: 1; transform: scaleY(.78); }
}

@keyframes antennaPulse {
    0%, 100% { opacity: .5; transform: translateX(-50%) scale(.8); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.2); }
}

@keyframes scanLine {
    0% { opacity: 0; transform: translate(-50%, 0) scaleX(0); }
    20% { opacity: 1; transform: translate(-50%, 0) scaleX(1); }
    100% { opacity: 0; transform: translate(-50%, 200px) scaleX(1); }
}

@keyframes dotIn { to { opacity: .9; } }

@keyframes floatDot {
    50% { translate: 0 -12px; opacity: .45; }
}

@keyframes connectionIn { to { opacity: .8; } }

@keyframes connectionPulse {
    0%, 100% { filter: brightness(.7); }
    50% { filter: brightness(1.8); }
}

@keyframes textIn {
    to { opacity: 1; transform: translateY(0); }
}

/* Responsividade */

@media (max-width: 600px) {
    .brand { left: 20px; top: 22px; font-size: 14px; }
    .version { right: 20px; top: 26px; font-size: 7px; letter-spacing: 2px; }

    .stage {
        top: 40%;
        height: 52vh;
    }

    .grapeWrap { width: min(300px, 72vw); }

    .water-orbit { width: 95vw; height: 45vw; }
    .water-trail { width: 88vw; height: 42vw; }

    .ring.one { width: 88vw; height: 120px; }
    .ring.two { width: 78vw; height: 100px; }
    .ring.three { width: 65vw; height: 80px; }
    .scanner { width: 68vw; }

    .nex {
        width: 105px;
        height: 105px;
        left: calc(50% + 75px);
        top: calc(50% - 42px);
    }

    .nex-core { width: 70px; height: 70px; border-radius: 22px; }
    .nex-face { width: 52px; height: 42px; border-radius: 14px; }
    .nex-eye { top: 12px; width: 7px; height: 11px; }
    .nex-eye.left { left: 11px; }
    .nex-eye.right { right: 11px; }
    .nex-mouth { bottom: 7px; width: 16px; }
    .nex-energy { inset: -5px; }

    .connection { width: 60px; }
    .content { bottom: 12%; }
    .content small { font-size: 7px; letter-spacing: 2.5px; }
    .content h1 { letter-spacing: 3px; }
    .product { margin-top: 12px; }
    .product-name { letter-spacing: 2px; }
    .product-caption { font-size: 7px; letter-spacing: 1.5px; }
    .content p { font-size: 7px; letter-spacing: 1.3px; }

    .progress { left: 20px; width: 100px; bottom: 22px; }
    .percent { left: 20px; bottom: 31px; }
    .skip { right: 20px; bottom: 17px; padding: 10px 13px; font-size: 8px; }
}

@media (max-height: 650px) {
    .stage { top: 41%; height: 70vh; }
    .grapeWrap { width: min(270px, 42vh); }
    .content { bottom: 7%; }
    .content h1 { font-size: clamp(34px, 5vw, 54px); }
    .product { margin-top: 7px; }
    .product-caption { margin-top: 4px; }
    .content p { margin-top: 6px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<section id="intro" aria-label="Abertura da GrapeDev">

    <canvas id="particles" aria-hidden="true"></canvas>
    <div class="ambient"></div>

        <div class="aura"></div>

        <small>TECNOLOGIA · CRIATIVIDADE · CÓDIGO</small>

            <div class="water-icon">
                <svg viewBox="0 0 32 42" fill="none" aria-hidden="true">
                    <path d="M16 2C12 10 4 18 4 26a12 12 0 0 0 24 0C28 18 20 10 16 2Z"
                        stroke="#21AAFF" stroke-width="3" fill="rgba(33,170,255,.13)"/>
                    <path d="M16 14C13 19 10 22 10 26a6 6 0 0 0 12 0c0-4-3-7-6-12Z"
                        fill="#21AAFF" opacity=".8"/>

                </svg>

    </div>

        PULAR INTRO&nbsp; →
    </button>

</section>

<script>
(() => {
    "use strict";

    const intro = document.getElementById("intro");
    const progressBar = document.getElementById("progressBar");
    const percent = document.getElementById("percent");
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    const skipButton = document.getElementById("skip");

    // Mantenha este caminho se sua página inicial for esta.
    const HOME_URL = "public/pages/home.html";

    // Duração da animação em milissegundos.
    const DURATION = 6500;

    let W = 0;
    let H = 0;
    let dpr = 1;
    let particles = [];
    let finished = false;
    let animationFrame = 0;
    let startTime = 0;

    const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);

        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Recria as partículas para manter a composição responsiva.
        const amount = W < 600 ? 75 : 150;

        particles = Array.from({ length: amount }, () => {
            const angle = Math.random() * Math.PI * 2;
            const distance = 100 + Math.random() * Math.max(W, H) * .55;

            return {
                x: W / 2 + Math.cos(angle) * distance,
                y: H * .43 + Math.sin(angle) * distance,
                size: .5 + Math.random() * 1.4,
                speed: .15 + Math.random() * .45,
                phase: Math.random() * Math.PI * 2,
                drift: 8 + Math.random() * 24
            };
        });
    }

    function drawParticles(now) {
        if (finished || reduceMotion) return;

        ctx.clearRect(0, 0, W, H);

        const elapsed = now - startTime;
        const gather = Math.min(Math.max((elapsed - 250) / 1800, 0), 1);
        const eased = 1 - Math.pow(1 - gather, 3);

        for (const p of particles) {
            p.phase += .008 * p.speed;

            const targetX =
                W / 2 + Math.cos(p.phase) * p.drift;

            const targetY =
                H * .43 + Math.sin(p.phase * 1.3) * p.drift * 1.5;

            // As partículas se aproximam da composição central.
            p.x += (targetX - p.x) * (.0015 + eased * .012);
            p.y += (targetY - p.y) * (.0015 + eased * .012);

            const alpha = Math.max(
                .12,
                .32 + Math.sin(p.phase * 2) * .16 + eased * .35
            );

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(174, 110, 255, ${alpha})`;
            ctx.fill();

            // Pequenas conexões digitais roxas e azuis.
            if (eased > .35 && Math.random() > .92) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(
                    p.x + (W / 2 - p.x) * .08,
                    p.y + (H * .43 - p.y) * .08
                );
                ctx.strokeStyle = `rgba(33, 170, 255, ${eased * .18})`;
                ctx.lineWidth = .6;
                ctx.stroke();
            }
        }

        animationFrame = requestAnimationFrame(drawParticles);
    }

    function goHome() {
        if (finished) return;
        finished = true;

        cancelAnimationFrame(animationFrame);

        progressBar.style.width = "100%";
        percent.textContent = "100%";
        skipButton.disabled = true;

        intro.classList.add("saindo");

        // Redireciona depois da transição visual.
        window.setTimeout(() => {
            window.location.href = HOME_URL;
        }, 800);
    }

    function updateProgress(now) {
        if (finished) return;

        const progress = Math.min((now - startTime) / DURATION, 1);
        const value = Math.floor(progress * 100);

        progressBar.style.width = value + "%";
        percent.textContent = String(value).padStart(2, "0") + "%";

        if (progress >= 1) {
            goHome();
            return;
        }

        requestAnimationFrame(updateProgress);
    }

    skipButton.addEventListener("click", goHome);

    document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !finished) {
            goHome();
        }
    });

    window.addEventListener("resize", resize);

    resize();

    startTime = performance.now();

    if (reduceMotion) {
        // Usuários que preferem menos movimento não ficam presos na intro.
        progressBar.style.width = "100%";
        percent.textContent = "100%";
        window.setTimeout(goHome, 700);
    } else {
        animationFrame = requestAnimationFrame(drawParticles);
        requestAnimationFrame(updateProgress);
    }
})();
</script>
